<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تم إيقاف الموقع - Sweets-Area</title>
    
    <!-- خطوط جوجل (Cairo) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    
    <!-- مكتبة أيقونات Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1e1e2f, #12121c);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px 30px;
            text-align: center;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
        }

        /* الصورة الرئيسية */
        .main-image-container {
            position: relative;
            width: 160px;
            height: 160px;
            margin: 0 auto 25px;
        }

        .main-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            border: 4px solid #e74c3c;
            box-shadow: 0 0 20px rgba(231, 76, 60, 0.4);
        }

        /* شارة التنبيه */
        .status-badge {
            display: inline-block;
            background: #e74c3c;
            color: #fff;
            padding: 6px 16px;
            border-radius: 50px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 15px;
            letter-spacing: 0.5px;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 10px;
            line-height: 1.4;
            color: #f1f1f1;
        }

        p.subtitle {
            color: #aaaaaa;
            font-size: 0.95rem;
            margin-bottom: 30px;
        }

        /* الشعار السفلي */
        .logo-container {
            margin: 25px 0;
        }

        .bottom-logo {
            max-height: 70px;
            width: auto;
            border-radius: 8px;
            opacity: 0.9;
        }

        /* قسم التواصل */
        .contact-section {
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-top: 25px;
            margin-top: 20px;
        }

        .contact-section p {
            font-size: 0.95rem;
            margin-bottom: 15px;
            color: #dddddd;
        }

        .fb-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: #1877f2;
            color: #ffffff;
            text-decoration: none;
            padding: 12px 25px;
            border-radius: 12px;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(24, 119, 242, 0.3);
        }

        .fb-btn:hover {
            background: #155db2;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(24, 119, 242, 0.4);
        }

        .fb-btn i {
            font-size: 1.2rem;
        }

        /* تحسينات للشاشات الصغيرة */
        @media (max-width: 480px) {
            h1 {
                font-size: 1.25rem;
            }
            .container {
                padding: 30px 20px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- الصورة الرئيسية -->
        <div class="main-image-container">
            <img class="main-image" src="https://scontent.fcai19-7.fna.fbcdn.net/v/t39.30808-6/485888488_122154354674446895_8888565562348049308_n.jpg?stp=dst-jpg_tt6&cstp=mx500x500&ctp=s500x500&_nc_cat=103&ccb=1-7&_nc_sid=6ee11a&_nc_eui2=AeF3qyPZixcVLfBKPPKdDNntXdrupThXxWZd2u6lOFfFZoyfU8jTy2Zsx4ImHhMZ_7Y6O8-ummB1nfga7abjqOVk&_nc_ohc=KEp_4V-C_nQQ7kNvwHsPt2y&_nc_oc=AdovlhBse5a7euwMnwV_obOmWBmmD2CyyYiSY3Xb-tp-JkUvOAK6gTeSJJRES9pfoA0&_nc_zt=23&_nc_ht=scontent.fcai19-7.fna&_nc_gid=qXfKQlxQ-nr_rUu3bwQDdQ&_nc_ss=7b2a8&oh=00_AQG9fuiHMvW2KtohLztSQdmZy_2kChUYvB8u1LV0A9nP6w&oe=6A75FCB2" alt="Sweets Area">
        </div>

        <!-- حالة الموقع -->
        <span class="status-badge"><i class="fa-solid fa-lock"></i> موقع مغلق</span>
        
        <!-- الرسالة الرئيسية -->
        <h1>تم إيقاف موقع Sweets-Area</h1>
        <p class="subtitle">❤️تم إيقاف تشغيل هذا الموقع مؤقتاً بواسطة الأدمن</p>

        <!-- اللوغو أسفل الصورة/النص -->
        <div class="logo-container">
            <img class="bottom-logo" src="toplogo1.jpg" alt="Logo">
        </div>

        <!-- الاستفسار وزر فيسبوك -->
        <div class="contact-section">
            <p>للاستفسار والتواصل مع الإدارة من خلال:</p>
            <a href="https://www.facebook.com/profile.php?id=61584178882412&locale=ar_AR" target="_blank" class="fb-btn">
                <i class="fa-brands fa-facebook-f"></i>
                <span>صفحتنا على فيسبوك</span>
            </a>
        </div>
    </div>

</body>
</html>
